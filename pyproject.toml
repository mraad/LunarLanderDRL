[project]
name = "lunar-lander-drl"
version = "0.1.0"
description = "Deep Q-Network with prioritized experience replay that lands the Gymnasium LunarLander."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.5",
    "gymnasium[box2d]>=1.3",
    "numpy>=2.5",
    "opencv-python-headless>=5.0",
    "tensorboardx>=2.6.5",
    "torch>=2.14",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "tensorboard>=2.21",
]

[tool.uv]
# Scripts and a package directory, not an installable distribution.
package = false
